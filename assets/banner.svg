<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes scan {
      0% { cy: 50px; }
      50% { cy: 300px; }
      100% { cy: 50px; }
    }
    .animated-shield { animation: float 6s ease-in-out infinite; transform-origin: center; }
    .animated-pulse { animation: pulse 4s ease-in-out infinite; }
    .scan-line { animation: scan 8s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg)" rx="16" />
  
  <!-- Grid pattern background -->
  <g opacity="0.08">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0 V350 M200 0 V350 M300 0 V350 M400 0 V350 M500 0 V350 M600 0 V350 M700 0 V350 M800 0 V350 M900 0 V350 M1000 0 V350 M1100 0 V350" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic background graphics (low opacity / in background) -->
  <g class="animated-pulse" opacity="0.4">
    <circle cx="1000" cy="175" r="140" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="8 8" />
    <circle cx="1000" cy="175" r="100" fill="none" stroke="#6366f1" stroke-width="1" />
  </g>

  <!-- Decorative Shield Graphic (Right Side Background Element) -->
  <g class="animated-shield" transform="translate(930, 80)">
    <path d="M70 0 L140 35 V105 C140 175 70 210 70 210 C70 210 0 175 0 105 V35 Z" fill="url(#shieldGrad)" stroke="url(#accent)" stroke-width="3" />
    <path d="M70 45 L95 85 L135 90 L105 120 L115 160 L70 135 L25 160 L35 120 L5 90 L45 85 Z" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Scanning visual element -->
  <line x1="850" y1="50" x2="1150" y2="50" stroke="#ec4899" stroke-width="2" opacity="0.3" class="scan-line" />

  <!-- Accent glow bar -->
  <rect x="80" y="65" width="220" height="28" rx="14" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.5" />
  <text x="95" y="84" class="badge-text">🛡️ BRAND PROTECTION ECOSYSTEM</text>

  <!-- Foreground Title and Subtitle (Guaranteed high visibility and foreground placement) -->
  <text x="80" y="145" class="title" filter="url(#glow)">Awesome Brand Protection Platform</text>
  <text x="80" y="195" class="subtitle">Curated SaaS &amp; Open-Source Ecosystem for Digital Risk &amp; IP Enforcement</text>

  <!-- Feature Pills -->
  <g transform="translate(80, 235)">
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">🔍 Counterfeit Detection</text>

    <rect x="185" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="205" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">⚖️ Trademark Monitoring</text>

    <rect x="380" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="400" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">🌐 Domain Typosquatting</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="344" width="1200" height="6" fill="url(#accent)" />
</svg>
